components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: vak_live_<id>_<secret>
      description: 'A key created at veruapis.com. VeruSuite credentials are not accepted here: a suite JWT, a personal API token or a session cookie is refused.'
  schemas:
    Error:
      type: object
      description: Every failure uses this shape.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: A stable identifier for the failure. Branch on this, never on the message, which is written for a person and may change.
            details:
              type: array
              description: Which fields were wrong, when that is the reason.
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
            message:
              type: string
            request_id:
              type: string
          required:
            - code
            - message
            - request_id
      required:
        - error
    Meta:
      type: object
      description: Present on every response.
      properties:
        request_id:
          type: string
          description: Quote this when reporting a problem.
        timestamp:
          type: string
          format: date-time
      required:
        - request_id
        - timestamp
