  /v1/spreadsheets/{id}/batch-update:
    post:
      operationId: spreadsheetsBatchUpdate
      summary: Change a spreadsheet's structure
      description: |-
        Inserts and deletes rows, columns and sheets, and changes merges, sorting, charts and validation. Requires sheets.structure.write, which is separate from writing values.

        Needs an If-Match header carrying the state from /state, and answers 422 without one. These are the changes that move data other requests address by position — inserting a row shifts every reference below it — so one applied against a stale view merges cleanly into a corrupt grid. A 409 means the document changed since your read: read state again and reapply. Retrying is safe on its own, because a successful apply moves the state and a replay answers 409 rather than applying twice.

        Requests apply in order and each sees the effect of the one before, so adding a sheet and writing to it in the same batch works.
      tags:
        - spreadsheets
      parameters:
        - name: id
          in: path
          required: true
          description: The spreadsheet to restructure.
          schema:
            type: string
            description: The spreadsheet to restructure.
        - name: If-Match
          in: header
          required: true
          description: The state token from the spreadsheet's /state, which is what makes this change conditional on the document you actually read. Without it the request is refused rather than applied to whatever the document has become.
          schema:
            type: string
            description: The state token from the spreadsheet's /state, which is what makes this change conditional on the document you actually read. Without it the request is refused rather than applied to whatever the document has become.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requests:
                  type: array
                  description: The changes to apply, in order. Each entry names exactly one operation. At least one.
                  items:
                    type: object
                    properties:
                      add_sheet:
                        type: object
                        description: Add a tab. Its reply carries the new sheet_id.
                        properties:
                          index:
                            type: integer
                            description: Where among the tabs. Appends when omitted.
                          title:
                            type: string
                            description: Defaults to the next free SheetN.
                        additionalProperties: false
                      delete_sheet:
                        type: object
                        description: Remove a tab and everything on it. The last remaining sheet cannot be deleted.
                        properties:
                          sheet_id:
                            type: string
                        required:
                          - sheet_id
                        additionalProperties: false
                      merge_cells:
                        type: object
                        description: Merge a rectangle, dropping any merge it overlaps. Its reply carries merge_id.
                        properties:
                          range:
                            type: string
                        required:
                          - range
                        additionalProperties: false
                      repeat_cell:
                        type: object
                        description: Apply formatting across a range.
                        properties:
                          number_format:
                            type: string
                            description: A format pattern, for example $#,##0.00.
                          range:
                            type: string
                          style:
                            type: object
                            description: Merged with the formatting already on each cell, so applying bold does not wipe a fill. A null value clears one attribute.
                            properties:
                              b:
                                type: string
                                description: Bold.
                              bg:
                                type: string
                                description: Fill colour, hex.
                              fg:
                                type: string
                                description: Text colour, hex.
                              ha:
                                type: string
                                enum:
                                  - left
                                  - center
                                  - right
                              i:
                                type: string
                                description: Italic.
                              s:
                                type: string
                                description: Strikethrough.
                              u:
                                type: string
                                description: Underline.
                              va:
                                type: string
                                enum:
                                  - top
                                  - middle
                                  - bottom
                            additionalProperties: false
                        required:
                          - range
                        additionalProperties: false
                      sort_range:
                        type: object
                        description: Sort a range by one of its columns.
                        properties:
                          column:
                            type: integer
                            description: Absolute column index, not an offset within the range.
                          descending:
                            type: boolean
                            description: Defaults to false.
                          range:
                            type: string
                        required:
                          - range
                          - column
                        additionalProperties: false
                      unmerge_cells:
                        type: object
                        description: Split the merges in a range. Its reply carries how many were removed.
                        properties:
                          range:
                            type: string
                        required:
                          - range
                        additionalProperties: false
                      update_dimension_properties:
                        type: object
                        description: Resize or hide rows and columns.
                        properties:
                          dimension:
                            type: string
                            enum:
                              - ROWS
                              - COLUMNS
                          hidden:
                            type: boolean
                          index:
                            type: integer
                            description: Which row or column, from 0.
                          pixel_size:
                            type: integer
                            description: null restores the default size.
                          sheet_id:
                            type: string
                        required:
                          - sheet_id
                          - dimension
                          - index
                        additionalProperties: false
                      update_sheet_properties:
                        type: object
                        description: Rename, move, recolour or hide a tab.
                        properties:
                          properties:
                            type: object
                            description: What to change. Omitted properties are left alone.
                            properties:
                              color:
                                type: string
                                description: 'Hex, for example #cc0000. An empty string clears it.'
                              hidden:
                                type: boolean
                              index:
                                type: integer
                              name:
                                type: string
                            additionalProperties: false
                          sheet_id:
                            type: string
                        required:
                          - sheet_id
                          - properties
                        additionalProperties: false
                    additionalProperties: false
              required:
                - requests
              additionalProperties: false
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      changed:
                        type: boolean
                        description: 'False when the write stored nothing new — writing a cell the value it already holds. Not an error and not worth retrying: no new state was produced and no collaborator was notified.'
                      replies:
                        type: array
                        description: 'One entry per request, in the same order, carrying whatever that operation returns: sheet_id for add_sheet, merge_id for merge_cells, removed for unmerge_cells. An empty object where an operation returns nothing.'
                        items:
                          type: object
                      state:
                        type: string
                        description: The document's state after the write. Send it as If-Match on a structural change, or compare it with your last one to notice somebody else's edit.
                    additionalProperties: false
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                  - data
                  - meta
        "401":
          description: The credential is missing, malformed, or not one this API issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: The key is valid but was not granted a permission this endpoint needs.
          content:
            application/json:
              schema:
