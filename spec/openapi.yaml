                folder_id:
                  type: string
                  description: Where the finished file lands. The root when omitted.
                mime_type:
                  type: string
                  description: 'Recorded, not trusted: the stored content type is sniffed from the bytes, which is what stops an executable arriving labelled as an image.'
                size:
                  type: integer
                  description: Total bytes. Required because it decides the part size that comes back.
              required:
