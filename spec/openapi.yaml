                        type: string
                      sheets:
                        type: array
                        description: Every sheet (tab) in the workbook, in tab order.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Accepted anywhere a sheet name is, and stable when the tab is renamed.
                            index:
                              type: integer
                              description: Position among the tabs, from 0.
                            max_column:
                              type: integer
                              description: The last populated column, zero-based.
                            max_row:
                              type: integer
                              description: The last populated row, zero-based. An empty sheet reports 0.
                            merges:
                              type: array
                              description: Merged rectangles, zero-based and inclusive at both corners.
                              items:
                                type: object
                                properties:
                                  c0:
                                    type: integer
                                    description: First column.
                                  c1:
                                    type: integer
                                    description: Last column, inclusive.
                                  id:
                                    type: string
                                  r0:
                                    type: integer
                                    description: First row.
                                  r1:
                                    type: integer
                                    description: Last row, inclusive.
                                additionalProperties: false
                            name:
                              type: string
                              description: 'The tab''s name as it appears in the app. Use it as the prefix in an A1 range: ''Q1 2026''!A1:D20.'
                            range:
                              type: string
                              description: The populated extent, which is what an unbounded range like A:A is clamped to.
