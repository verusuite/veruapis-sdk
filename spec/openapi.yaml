    post:
      operationId: calendarCreateEvent
      summary: Create an event
      description: |-
        Creates an event and sends invitations to any attendees.

        Listing an attendee sends them an invitation. To reschedule afterwards use PATCH rather than deleting and recreating: PATCH keeps the id and UID and raises the sequence, so their calendar updates the meeting in place instead of cancelling one and inviting them to another.
      tags:
        - calendar
      parameters:
        - name: calendar_id
          in: path
          required: true
          description: The calendar to add it to.
          schema:
            type: string
            description: The calendar to add it to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                all_day:
                  type: boolean
                  description: Stores dates without times. Defaults to false.
                attendees:
                  type: array
                  description: Who is invited. Listing anyone here sends them an invitation.
                  items:
                    type: object
                    properties:
                      cutype:
                        type: string
                        description: What kind of attendee this is. Defaults to INDIVIDUAL.
                        enum:
                          - INDIVIDUAL
                          - GROUP
                          - RESOURCE
                          - ROOM
                      display_name:
                        type: string
                        description: Shown instead of the address in a calendar app.
                      email:
                        type: string
                        description: The only required field on an attendee.
                      partstat:
                        type: string
                        description: Their answer. Set it only when you already know it; otherwise leave it for them to give. Defaults to NEEDS-ACTION.
                        enum:
                          - NEEDS-ACTION
                          - ACCEPTED
                          - DECLINED
                          - TENTATIVE
                          - DELEGATED
                      role:
                        type: string
                        description: Whether their presence is needed, optional, or informational. Defaults to REQ-PARTICIPANT.
                        enum:
                          - REQ-PARTICIPANT
                          - OPT-PARTICIPANT
                          - NON-PARTICIPANT
                          - CHAIR
                    required:
                      - email
                    additionalProperties: false
                description:
                  type: string
                ends_at:
                  type: string
                  format: date-time
                  description: Must be after starts_at.
                location:
                  type: string
                organizer:
                  type: string
                  description: The address shown as organiser. Defaults to you.
                rrule:
                  type: string
                  description: An RFC 5545 recurrence rule, for example FREQ=WEEKLY;BYDAY=TU,TH.
                starts_at:
                  type: string
                  format: date-time
                  description: In UTC. 2026-09-05T12:00:00Z is 3pm where the offset is +03:00.
                summary:
                  type: string
                  description: The title, as it appears in a calendar app.
                url:
                  type: string
                  description: Typically a meeting link.
              required:
                - summary
                - starts_at
                - ends_at
              additionalProperties: false
      responses:
