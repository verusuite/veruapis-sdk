      parameters:
        - name: id
          in: path
          required: true
          description: The spreadsheet to read.
          schema:
            type: string
            description: The spreadsheet to read.
        - name: range
          in: path
          required: true
          description: 'A1 notation: A1, A1:D20, Sheet1!A1:D20, ''Q1 2026''!A1, A:C for whole columns, 2:5 for whole rows. No sheet prefix means the first tab. Corners may be given in either order, $ is accepted and ignored, and an unbounded range is clamped to the populated extent.'
          schema:
            type: string
            description: 'A1 notation: A1, A1:D20, Sheet1!A1:D20, ''Q1 2026''!A1, A:C for whole columns, 2:5 for whole rows. No sheet prefix means the first tab. Corners may be given in either order, $ is accepted and ignored, and an unbounded range is clamped to the populated extent.'
        - name: value_render
          in: query
          description: stored returns what is in the cell, so a formula comes back as its text. computed evaluates it and returns the result.
