    put:
      operationId: spreadsheetsPutValues
      summary: Write a range
      description: |-
        Overwrites one A1 range.

        Value writes merge: setting a cell is last-write-wins on that one key, so two writers produce a defined result and this never answers 409. No precondition is needed, and none is accepted.

        Values shorter than the range leave the rest of it untouched: writing two rows into a ten-row range writes two rows. Clearing is a separate call for exactly that reason.
      tags:
        - spreadsheets
      parameters:
        - name: id
          in: path
          required: true
          description: The spreadsheet to write to.
          schema:
            type: string
            description: The spreadsheet to write to.
        - name: range
          in: path
          required: true
          description: Where the block lands. Values are anchored at its top-left corner.
          schema:
            type: string
            description: Where the block lands. Values are anchored at its top-left corner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: array
                  description: Rows, each an array of cells. A cell is a string, a number or a boolean; a formula is a string beginning with =. An empty string DELETES a cell rather than storing a blank, because a stored blank would keep it inside the sheet's used extent and widen every unbounded range from then on.
                  items:
