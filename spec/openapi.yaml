                        type: string
                        description: 'The range, resolved: a sheet-less or unbounded range comes back fully qualified.'
                      values:
                        type: array
                        description: Rows of cells, always rectangular. An empty cell comes back as an empty string, so you need not bounds-check each row.
                        items:
