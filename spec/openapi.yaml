  /v1/spreadsheets/{id}/values/{range}:
    get:
      operationId: spreadsheetsGetValues
      summary: Read a range
      description: |-
        Reads one A1 range: values, formulas and formatting.

        computed costs a pass over the whole workbook rather than over your range, because a formula in it can depend on a cell far outside it, so a bulk export should not ask for one it does not need. It is never cached and always current, and answers 503 when no formula engine is running — where omitting the parameter still works.
